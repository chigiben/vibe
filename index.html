<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אשכרה | בומצו הפקות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root{--beer:#f5bd36;--foam:#fff7df;--ink:#1a170e}*{box-sizing:border-box}body{margin:0;background:var(--beer);color:var(--ink);font-family:"Alef",Arial,Helvetica,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden}main:before,main:after{content:"";position:absolute;width:52vmax;height:52vmax;border-radius:50%;border:12vmax solid rgba(255,247,223,.46)}main:before{top:-34vmax;left:-28vmax}main:after{right:-31vmax;bottom:-36vmax}.brand{position:absolute;top:24px;left:28px;margin:0;font-weight:700;letter-spacing:.05em;font-size:14px}.card{width:min(100%,470px);text-align:center;background:var(--foam);border:2px solid var(--ink);box-shadow:9px 9px 0 var(--ink);padding:clamp(34px,6vw,58px) clamp(24px,5vw,46px);position:relative;z-index:1}.eyebrow{margin:0 0 16px;font-size:15px;font-weight:700}.promise{margin:-4px 0 22px;font-size:18px;font-weight:700}h1{margin:0;font-size:clamp(43px,11vw,68px);letter-spacing:-.06em;line-height:1}.remaining{margin:38px 0 34px;display:grid;gap:4px}.remaining strong{font-size:clamp(76px,21vw,120px);line-height:.85;letter-spacing:-.09em}.remaining span{font-size:17px;font-weight:700}.bit-link{display:block;padding:18px 22px;background:var(--ink);color:var(--foam);text-decoration:none;font-weight:700;font-size:21px;border:2px solid var(--ink)}.nonprofit{margin:22px 0 0;font-size:14px;font-weight:700}@media(max-width:520px){main{padding:20px}.brand{top:18px;left:20px}.card{box-shadow:6px 6px 0 var(--ink)}}
    </style>
  </head>
  <body>
    <main>
      <p class="brand">בומצו הפקות</p>
      <section class="card">
        <p class="eyebrow">אשכרה · 7.8 · Art Club, תל אביב</p>
        <p class="promise">אלכוהול חופשי ומוזיקה טובה</p>
        <h1>₪69 לכרטיס</h1>
        <p class="remaining"><strong id="remaining">67</strong><span>כרטיסים נותרו</span></p>
        <a class="bit-link" href="https://www.bitpay.co.il/app/me/2A1D769C-7D65-28F3-3552-0406F706953F4C2B">לתשלום בביט</a>
        <p class="nonprofit">אירוע ללא מטרת רווח</p>
      </section>
    </main>
    <script>
      const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vQjN6Osn2MyLkOt1oiZKbrvVNcjwkNKxfQyhkmrxvI42Y_QllTCl0oNiMPtOTGZ8V6eNI_xUOebFHo-/pub?gid=1701885759&single=true&output=csv";
      async function update(){try{const text=await fetch(url,{cache:"no-store"}).then(r=>r.text());const row=text.trim().split(/\r?\n/).map(r=>r.split(",")).find(r=>r[0].replaceAll('"','').trim()==="נותרו");if(row){const n=Number(row[1].replaceAll('"','').trim());if(Number.isFinite(n))document.querySelector('#remaining').textContent=n}}catch{}}update();setInterval(update,60000);
    </script>
  </body>
</html>
